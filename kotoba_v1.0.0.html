<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことのは</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg1:#fdf3e3;--bg2:#f7dfc4;--accent:#e8954a;--text:#3b2a1a;--sub:#a07040;--dot:rgba(232,149,74,0.15);--td:1.1s}
body.noon   {--bg1:#fffbe6;--bg2:#fff0b0;--accent:#c9a200;--text:#2e2600;--sub:#8a7a00;--dot:rgba(201,162,0,0.13)}
body.eve    {--bg1:#f3e8f8;--bg2:#ddc8ef;--accent:#9b6bbf;--text:#2a1a3a;--sub:#7a50a0;--dot:rgba(155,107,191,0.15)}
body.night  {--bg1:#1e1e2e;--bg2:#12121e;--accent:#7ebfff;--text:#e8eaf6;--sub:#8899bb;--dot:rgba(126,191,255,0.10)}
body.wday   {--bg1:#e8f4ee;--bg2:#cce8d8;--accent:#3aaa6e;--text:#1a2e24;--sub:#4a8a60;--dot:rgba(58,170,110,0.12)}
body.weve   {--bg1:#1e2230;--bg2:#12141e;--accent:#a0c4ff;--text:#e8ecf6;--sub:#8090b0;--dot:rgba(160,196,255,0.10)}
body{font-family:'Zen Maru Gothic',sans-serif;background:linear-gradient(145deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background var(--td);position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--dot) 1.5px,transparent 1.5px);background-size:28px 28px;transition:all var(--td)}
.card{position:relative;z-index:1;text-align:center;padding:3rem 2rem;max-width:500px;width:90%}

.hall-tag{font-size:.68rem;letter-spacing:.12em;color:var(--accent);height:1.2em;margin-bottom:1rem;opacity:0;transition:opacity .4s,color var(--td)}
.hall-tag.on{opacity:1}
.msg-wrap{min-height:7rem;display:flex;align-items:center;justify-content:center}
.msg{font-family:'Klee One',cursive;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:600;color:var(--text);line-height:1.7;letter-spacing:.06em;opacity:0;transform:translateY(12px);animation:up .6s ease forwards;transition:color var(--td)}
@keyframes up{to{opacity:1;transform:translateY(0)}}
.dot{display:block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin:1.6rem auto;transition:background var(--td)}
.source{font-family:'Zen Maru Gothic',sans-serif;font-size:.72rem;color:var(--sub);letter-spacing:.1em;margin-top:.8rem;min-height:1.1em;opacity:0;transition:opacity .4s,color var(--td)}
.source.on{opacity:1}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.btn{background:none;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;font-size:.82rem;letter-spacing:.12em;border-radius:2rem;padding:.5rem 1.3rem;transition:background .2s,color .2s,border-color var(--td)}
.btn-next{border:1.5px solid var(--accent);color:var(--accent)}
.btn-next:hover{background:var(--accent);color:var(--bg1)}
.btn-like{border:1.5px solid var(--sub);color:var(--sub)}
.btn-like:hover,.btn-like.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.topbar{position:fixed;top:.9rem;right:1rem;display:flex;gap:.5rem;z-index:20;align-items:center}
.tbtn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:var(--sub);font-family:'Zen Maru Gothic',sans-serif;font-size:.7rem;padding:.25rem .7rem;border-radius:1rem;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
.tbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.clock{font-size:.68rem;color:var(--sub);opacity:.6;font-family:'Zen Maru Gothic',sans-serif;letter-spacing:.06em;transition:color var(--td)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg1);border-radius:1.2rem;padding:1.8rem;max-width:460px;width:92%;max-height:78vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2);transition:background var(--td)}
.modal h2{font-family:'Klee One',cursive;font-size:1.05rem;color:var(--text);margin-bottom:1rem;letter-spacing:.1em;transition:color var(--td)}
.mclose{float:right;background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--sub);transition:color var(--td)}
.mclose:hover{color:var(--accent)}
.hlist{list-style:none}
.hlist li{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem 0;border-bottom:1px solid rgba(128,128,128,.12)}
.hlist li:last-child{border-bottom:none}
.htext{flex:1;font-family:'Klee One',cursive;font-size:.9rem;color:var(--text);line-height:1.55;transition:color var(--td)}
.htag{display:block;font-size:.62rem;color:var(--sub);margin-top:.15rem}
.rmv{background:none;border:none;cursor:pointer;color:var(--sub);font-size:.8rem;padding:.1rem .3rem;border-radius:.3rem;transition:all .2s;flex-shrink:0}
.rmv:hover{background:#fee;color:#c44}
.empty{text-align:center;color:var(--sub);font-size:.85rem;padding:1.5rem 0}
</style>
</head>
<body>

<div class="topbar">
  <span class="clock" id="clock"></span>
  <button class="tbtn" onclick="openHall()">★ 殿堂</button>
</div>

<div class="card">

  <div class="hall-tag" id="hall-tag">★ 殿堂入り</div>
  <div class="msg-wrap"><div class="msg" id="msg"></div></div>
  <div class="source" id="source"></div>

  <div class="btns">
    <button class="btn btn-like" id="btn-like" onclick="toggleLike()">♡ 好き</button>
  </div>
</div>



<div class="overlay" id="hall-overlay">
  <div class="modal">
    <button class="mclose" onclick="closeHall()">✕</button>
    <h2>★ 殿堂入りのことば</h2>
    <ul class="hlist" id="hlist"></ul>
  </div>
</div>

const KEY_HALL='kotoba_hall';
const KEY_MSGS='kotoba_msgs';
const KEY_MONTH='kotoba_month';
const KEY_USED='kotoba_used';

let currentSlot=null, currentText='';

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}

function getSlot(){
  const now=new Date(),dow=now.getDay(),wd=dow>=1&&dow<=5;
  let h=now.getHours();if(h<5)h+=24;
  return SLOTS.find(s=>s.wd===wd&&h>=s.h0&&h<s.h1)||(wd?SLOTS[3]:SLOTS[5]);
}

function getMsgs(key){
  const stored=load(KEY_MSGS,{});
  return(stored[key]&&stored[key].length>0)?stored[key]:BASE[key];
}

function pickRandom(key){
  const hall=load(KEY_HALL,[]).filter(h=>h.slotKey===key).map(h=>h.text);
  const base=getMsgs(key);
  const pool=[...base,...hall];
  if(!pool.length)return{text:'今日もよい一日を。',source:null};
  let used=load(KEY_USED,{});
  if(!used[key]||used[key].length>=pool.length){used[key]=[];save(KEY_USED,used);}
  const rem=pool.map((_,i)=>i).filter(i=>!used[key].includes(i));
  const idx=rem[Math.floor(Math.random()*rem.length)];
  used[key].push(idx);save(KEY_USED,used);
  const item=pool[idx];
  // 文字列ならsourceなし、オブジェクトならtext/source取得
  return typeof item==='string'?{text:item,source:null}:{text:item.text,source:item.source||null};
}

function applyTheme(slot){document.body.className=slot.cls||'';}

function showMessage(slotKey){
  const slot=SLOTS.find(s=>s.key===slotKey)||getSlot();
  currentSlot=slot; applyTheme(slot);
  const {text,source}=pickRandom(slotKey);
  currentText=text;
  const el=document.getElementById('msg');
  el.style.animation='none'; el.textContent='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.animation='';el.textContent=text;}));
  // 出典表示
  const srcEl=document.getElementById('source');
  srcEl.textContent=source?'— '+source:'';
  srcEl.classList.toggle('on',!!source);
  const isHall=load(KEY_HALL,[]).some(h=>h.text===text&&h.slotKey===slotKey);
  document.getElementById('hall-tag').classList.toggle('on',isHall);
  const btn=document.getElementById('btn-like');
  btn.classList.toggle('on',isHall);
  btn.textContent=isHall?'★ 好き':'♡ 好き';
}

function next(){showMessage(currentSlot.key);}

function toggleLike(){
  const hall=load(KEY_HALL,[]);
  const idx=hall.findIndex(h=>h.text===currentText&&h.slotKey===currentSlot.key);
  if(idx>=0){hall.splice(idx,1);}
  else{hall.push({text:currentText,slotKey:currentSlot.key,slotLabel:currentSlot.label,savedAt:new Date().toISOString()});}
  save(KEY_HALL,hall);
  const isHall=idx<0;
  document.getElementById('hall-tag').classList.toggle('on',isHall);
  const btn=document.getElementById('btn-like');
  btn.classList.toggle('on',isHall);
  btn.textContent=isHall?'★ 好き':'♡ 好き';
}

function openHall(){
  const hall=load(KEY_HALL,[]);
  const list=document.getElementById('hlist');
  list.innerHTML='';
  if(!hall.length){
    list.innerHTML='<li class="empty">まだ殿堂入りのことばはありません</li>';
  } else {
    hall.slice().reverse().forEach((h,ri)=>{
      const realIdx=hall.length-1-ri;
      const li=document.createElement('li');
      li.innerHTML=`<div class="htext">${h.text}<span class="htag">${h.slotLabel}</span></div><button class="rmv" onclick="removeHall(${realIdx})">✕</button>`;
      list.appendChild(li);
    });
  }
  document.getElementById('hall-overlay').classList.add('open');
}
function closeHall(){document.getElementById('hall-overlay').classList.remove('open');}

function removeHall(idx){
  const hall=load(KEY_HALL,[]);
  hall.splice(idx,1); save(KEY_HALL,hall);
  openHall();
  const isHall=hall.some(h=>h.text===currentText&&h.slotKey===currentSlot.key);
  document.getElementById('hall-tag').classList.toggle('on',isHall);
  const btn=document.getElementById('btn-like');
  btn.classList.toggle('on',isHall);
  btn.textContent=isHall?'★ 好き':'♡ 好き';
}


function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});}

showMessage(getSlot().key);
updateClock();
setInterval(updateClock,30000);
</script>
